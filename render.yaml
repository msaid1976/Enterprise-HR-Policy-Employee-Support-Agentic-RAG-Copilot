# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
# Render reads this file, builds the Dockerfile below, and asks you to fill
# in the "sync: false" secrets in its UI — it never reads them from here.

services:
  - type: web
    name: hr-agentic-rag-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_NAME
        value: Enterprise HR Policy Agentic RAG Copilot
      - key: APP_ENV
        value: production

      # ---- LLM provider ----
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LLM_TEMPERATURE
        value: 0
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ---- Embeddings ----
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: HUGGINGFACE_EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2

      # ---- Web search fallback ----
      - key: TAVILY_API_KEY
        sync: false

      # ---- Vector store ----
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: fde-hr-policy-rag
      - key: PINECONE_NAMESPACE
        value: company-hr-kb

      # ---- Retrieval tuning ----
      - key: TOP_K
        value: 4
      - key: MAX_RETRIES
        value: 1

      # ---- LangSmith tracing (optional) ----
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGCHAIN_PROJECT
        value: FDE-HR_project
      - key: LANGCHAIN_API_KEY
        sync: false

      # ---- Security ----
      - key: ADMIN_API_KEY
        generateValue: true
